workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: AppStoreKey 
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "io.eventoo.mobile" # Check this matches your App Store ID
    scripts:
      - name: Clean up and Fetch Dependencies
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          flutter pub get
          cd ios && pod install --repo-update
      - name: Set up Code Signing
        script: |
          # 1. Prepare the Mac's keychain to store certificates
          keychain initialize
          
          # 2. Fetch the certificates from Apple using your API key
          # Use --type IOS_APP_STORE for release builds
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          
          # 3. Import those certificates into the Mac's system
          keychain add-certificates
          
          # 4. Tell the project to use these new files
          xcode-project use-profiles
      - name: Build IPA for Release
        script: |
          # This command now has the certificates it needs!
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - tchourabi@gmail.com