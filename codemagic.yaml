workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: AppStoreKey 
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "io.eventoo.mobile"
    scripts:
      - name: Clean up and Fetch Dependencies
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          flutter pub get
          cd ios && pod install --repo-update
      - name: Set up Code Signing
        script: |
          keychain initialize
          
          # 1. Force Manual signing style
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          
          # 2. Force Distribution Identity (This is the critical fix for your error)
          # We are replacing 'iPhone Developer' with 'iPhone Distribution' everywhere
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "iPhone Distribution";/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Distribution";/g' ios/Runner.xcodeproj/project.pbxproj
          
          # 3. Fetch App Store Distribution files
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          
          # 4. Finalize the virtual Mac's environment
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA for Release
        script: |
          # Use --export-method to ensure Flutter knows we are going to the Store
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - tchourabi@gmail.com