workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: AppStoreKey 
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "io.eventoo.mobile"
    scripts:
      - name: Clean up and Fetch Dependencies
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          flutter pub get
          cd ios && pod install --repo-update
      - name: Set up Code Signing
        script: |
          # 1. Prepare the Mac's keychain
          keychain initialize
          
          # 2. Force the project file to use Manual signing instead of Automatic
          # This fixes the "No valid code signing certificates found" error on CI
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          
          # 3. Fetch certificates from Apple
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          
          # 4. Import certificates and map profiles
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA for Release
        script: |
          # We use the --release flag and let Codemagic handle the final export
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - tchourabi@gmail.com